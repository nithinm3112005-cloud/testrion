[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# API proxy to the Render backend (replace URL after deploying backend)
[[redirects]]
  from = "/api/*"
  to = "https://testrion-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
