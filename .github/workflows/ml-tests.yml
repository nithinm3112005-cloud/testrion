name: ML model tests

# Automatically test the ML model and the testing platform whenever code is pushed or updated.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run automated test cases (pytest)
        working-directory: backend
        run: python -m pytest tests -q
      - name: Deployment gate for the house-price model (accuracy >= 85%, parity < 10%)
        working-directory: backend
        run: python ci_check.py --dataset house_price --model gradient_boosting_reg --impute
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-test-report
          path: backend/ci-report.json
